services:  
  ollama:
    container_name: ollama
    image: ollama/ollama
    pull_policy: always
    ports:
      - "11434:11434"
      - "4000:4000"
        #    environment:
        #      - OLLAMA_KEEP_ALIVE=1h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]    
    volumes:
      - ollama:/root/.ollama
      - ./localModels:/localModels
      - /home/manoj/Github/UnSlothFineTune:/models
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    pull_policy: always
    container_name: ngrok
    network_mode: host
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http --domain=${NGROK_DOMAIN} --host-header="localhost:11434" 11434
    restart: unless-stopped

volumes:
    ollama:
